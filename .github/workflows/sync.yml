name: Synch Github To Gitee
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 10 * * *"
    - cron: "0 20 * * *"

jobs:  
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Config
        run: |
          sudo apt update
          sudo apt install git -y

      - name: Push
        env: 
          GITHUBTOKEN: ${{ secrets.GITHUBTOKEN }}
          GITHUBUSER: ${{ secrets.GITHUBUSER }}
          GITEEUSER: ${{ secrets.GITEEUSER }}
          GITEETOCKEN: ${{ secrets.GITEETOCKEN }}
        run: |
          cd sync-github-to-gitee
          python3 sync.py "$GITHUBUSER" "$GITHUBTOKEN" "$GITEEUSER" "$GITEETOCKEN"
